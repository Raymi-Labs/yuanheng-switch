[package]
name = "yuanheng-mobile"
version = "0.1.0-alpha.1"
description = "元衡移动客户端"
edition = "2021"
rust-version = "1.95"
license = "MIT"

[lib]
name = "yuanheng_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.4"

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-yuanheng-native = { path = "../native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
url = "2"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"
