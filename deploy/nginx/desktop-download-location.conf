# Include inside the HTTPS server that already defines the nan_cluster upstream.
# Versioned, public installers only; latest.json, publish and account/API routes
# continue to use their existing locations. Preserve the application's no-store
# response for missing/disabled artifacts instead of caching every HTTP status.
location ^~ /desktop/update/releases/ {
    proxy_pass http://nan_cluster;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_buffering on;
    proxy_cache off;
    gzip off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    send_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
}
