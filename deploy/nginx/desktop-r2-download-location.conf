# Replacement for desktop-download-location.conf, inside the same HTTPS server.
# Activate only after every matching existing origin asset is verified in R2,
# and the R2-first delivery workflow is configured. Do not combine both locations.
# Keep origin copies for platform manifest validation and emergency rollback.
location ^~ /desktop/update/releases/ {
    set $desktop_r2_location "";
    set $desktop_r2_origin_file "";
    if ($uri ~ "^/desktop/update/releases/(?<r2_version>[0-9]+\.[0-9]+\.[0-9]+)/(?<r2_filename>YuanHeng\.Desktop_[0-9]+\.[0-9]+\.[0-9]+_(?:aarch64|x64)(?:\.app\.tar\.gz|\.dmg|-setup\.exe)(?:\.sig)?)$") {
        set $desktop_r2_location https://download.meta-api.vip$uri;
        set $desktop_r2_origin_file /opt/newapi/newapi_data/desktop-updates/releases/$r2_version/$r2_filename;
    }
    if (!-f $desktop_r2_origin_file) {
        set $desktop_r2_location "";
    }
    if ($request_method !~ "^(GET|HEAD)$") {
        set $desktop_r2_location "";
    }
    # Public, read-only diagnostic bypass; never bypasses application upload auth.
    # The mirror publisher must inspect the origin, not accidentally follow R2.
    if ($arg_origin = 1) {
        set $desktop_r2_location "";
    }
    if ($desktop_r2_location != "") {
        add_header Cache-Control "no-store" always;
        return 302 $desktop_r2_location;
    }

    proxy_pass http://nan_cluster;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering on;
    proxy_cache off;
    gzip off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    send_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
}
