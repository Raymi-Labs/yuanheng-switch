name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate version, types and tests
        run: |
          pnpm check:release-version
          pnpm typecheck
          pnpm test:unit
          python3 scripts/test_apple_release_tools.py
          python3 scripts/test_verify_macos_release.py
          python3 scripts/test_sync_desktop_r2.py
          python3 scripts/test_mirror_desktop_update.py

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    permissions:
      contents: read
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # 三个平台只构建并上传独立 artifact；Release 和 latest.json 由 finalize 独占。
      max-parallel: 3
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis

    runs-on: ${{ matrix.platform }}
    env:
      # Only contents:read in this job; no build worker can publish a Release.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      YUANHENG_BUILD_TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Setup pnpm
        if: matrix.platform != 'macos-15-intel'
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Setup pnpm on Intel macOS
        if: matrix.platform == 'macos-15-intel'
        run: npm install --global pnpm@10.12.3

      - name: Setup Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify updater signing secrets
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Require Apple Developer ID signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARIZATION_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CERTIFICATE CERTIFICATE_PASSWORD SIGNING_IDENTITY NOTARIZATION_APPLE_ID NOTARIZATION_PASSWORD NOTARIZATION_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required Apple signing/notarization configuration: $name"
              exit 1
            fi
          done
          [[ "$SIGNING_IDENTITY" == "Developer ID Application: "* ]]
          [[ "$SIGNING_IDENTITY" == *"($NOTARIZATION_TEAM_ID)" ]]

          write_env() {
            local key="$1"
            local value="$2"
            local delimiter="__YUANHENG_${key}__"
            {
              echo "$key<<$delimiter"
              printf '%s\n' "$value"
              echo "$delimiter"
            } >> "$GITHUB_ENV"
          }

          write_env APPLE_CERTIFICATE "$CERTIFICATE"
          write_env APPLE_CERTIFICATE_PASSWORD "$CERTIFICATE_PASSWORD"
          write_env APPLE_SIGNING_IDENTITY "$SIGNING_IDENTITY"

          write_env APPLE_ID "$NOTARIZATION_APPLE_ID"
          write_env APPLE_PASSWORD "$NOTARIZATION_PASSWORD"
          write_env APPLE_TEAM_ID "$NOTARIZATION_TEAM_ID"

      - name: Verify Apple notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        run: |
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json > /dev/null

      - name: Install bounded Apple tool retries
        if: runner.os == 'macOS'
        run: python3 scripts/apple-release-tools.py install

      - name: Build signed bundles without publishing
        id: tauri
        uses: tauri-apps/tauri-action@v1
        with:
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Report and enforce Apple tool results
        if: always() && runner.os == 'macOS' && steps.tauri.outcome != 'skipped'
        run: python3 scripts/apple-release-tools.py report "$YUANHENG_BUILD_TARGET"

      - name: Verify macOS signing, notarization and packaged apps
        if: runner.os == 'macOS'
        shell: bash
        run: python3 scripts/verify-macos-release.py "$YUANHENG_BUILD_TARGET"

      - name: Stage target artifacts and receipt
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          BUILT_APP_VERSION: ${{ steps.tauri.outputs.appVersion }}
          BUILD_TARGET: ${{ matrix.target }}
        run: node scripts/desktop-release.mjs collect "$BUILD_TARGET" "release/targets/$BUILD_TARGET"

      - name: Upload target artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: release/targets/${{ matrix.target }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  finalize-updater-manifest:
    name: Publish complete release and updater manifest
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout release scripts and announcements
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Download this run's target artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release/downloads
          merge-multiple: false
          digest-mismatch: error

      - name: Verify all targets and generate the single manifest
        run: node scripts/desktop-release.mjs assemble release/downloads release/final

      - name: Upload and verify draft, then publish stable tags
        run: node scripts/desktop-release.mjs publish release/final

  mirror-desktop-update:
    name: Deliver release through R2 and YuanHeng platform
    needs: finalize-updater-manifest
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/desktop-delivery.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      DESKTOP_UPDATE_PUBLISH_URL: ${{ secrets.DESKTOP_UPDATE_PUBLISH_URL }}
      DESKTOP_UPDATE_PUBLISH_TOKEN: ${{ secrets.DESKTOP_UPDATE_PUBLISH_TOKEN }}
