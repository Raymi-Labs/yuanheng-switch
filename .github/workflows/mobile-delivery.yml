name: Android website download delivery

on:
  workflow_dispatch:
    inputs:
      version:
        description: "已发布且具有校验元数据的手机版本，例如 0.1.0-alpha.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-download-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MOBILE_VERSION: ${{ inputs.version }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: yuanheng-desktop-downloads
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install verification tools
        run: |
          sdkmanager 'build-tools;36.0.0'
          echo "APKSIGNER=$ANDROID_HOME/build-tools/36.0.0/apksigner" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/mobile-delivery"
          "$RUNNER_TEMP/mobile-delivery/bin/pip" install -r scripts/r2-requirements.txt
      - name: Verify signed Android release and publish immutable downloads
        run: '"$RUNNER_TEMP/mobile-delivery/bin/python" scripts/sync-mobile-r2.py "$MOBILE_VERSION"'
