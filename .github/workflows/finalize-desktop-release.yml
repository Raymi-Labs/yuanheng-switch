name: Resume Desktop Release Finalization

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Desktop Release run with all three successful build artifacts
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-recovery-${{ inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  finalize:
    name: Recover verified release without rebuilding
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.source.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DESKTOP_RELEASE_CONTEXT: release/context.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
      - name: Verify source run, builds, tag and metadata
        id: source
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: node scripts/desktop-release.mjs recover-context "$SOURCE_RUN_ID" release/context.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          pattern: desktop-*
          path: release/downloads
          merge-multiple: false
          digest-mismatch: error
      - run: node scripts/desktop-release.mjs assemble release/downloads release/final
      - run: node scripts/desktop-release.mjs publish release/final

  mirror:
    name: Deliver recovered release through R2 and platform
    needs: finalize
    uses: ./.github/workflows/desktop-delivery.yml
    with:
      version: ${{ needs.finalize.outputs.version }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      DESKTOP_UPDATE_PUBLISH_URL: ${{ secrets.DESKTOP_UPDATE_PUBLISH_URL }}
      DESKTOP_UPDATE_PUBLISH_TOKEN: ${{ secrets.DESKTOP_UPDATE_PUBLISH_TOKEN }}
