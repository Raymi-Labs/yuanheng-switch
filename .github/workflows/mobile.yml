name: Mobile Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: mobile/package.json
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: mobile/src-tauri -> target
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check && cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib && cargo clippy --locked --manifest-path src-tauri/Cargo.toml --lib -- -D warnings
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: mobile/package.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android SDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: mobile/src-tauri -> target
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri android init --ci --skip-targets-install
      - run: pnpm tauri icon src-tauri/icons/icon.png
      - run: pnpm tauri android build --ci --target aarch64 --apk
      - name: Sign APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.YUANHENG_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.YUANHENG_ANDROID_KEYSTORE_PASSWORD }}
        run: python3 scripts/sign_android.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name != 'pull_request'
        with:
          name: yuanheng-android-arm64
          path: mobile/artifacts/*
          if-no-files-found: error
  ios:
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: mobile/package.json
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: mobile/src-tauri -> target
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri ios init --ci --skip-targets-install
      - run: pnpm tauri icon src-tauri/icons/icon.png
      - name: Build iPhone archive without signing
        run: pnpm tauri ios build --ci --target aarch64 --no-sign --archive-only
      - name: Package unsigned device archive
        run: |
          mkdir -p artifacts
          python3 scripts/package_ios.py device
      - name: Build simulator archive
        run: pnpm tauri ios build --ci --target aarch64-sim --archive-only
      - name: Package simulator archive
        run: python3 scripts/package_ios.py simulator
      - name: Launch in iPhone simulator
        run: python3 scripts/smoke_ios.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: yuanheng-ios-unsigned-development
          path: mobile/artifacts/*
          if-no-files-found: error
