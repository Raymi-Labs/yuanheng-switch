name: Resume Desktop Update Mirror

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published stable version to mirror (for example 0.1.51)
        required: true
        type: string

permissions:
  contents: read

jobs:
  mirror:
    name: Resume R2 and platform delivery
    uses: ./.github/workflows/desktop-delivery.yml
    with:
      version: ${{ inputs.version }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      DESKTOP_UPDATE_PUBLISH_URL: ${{ secrets.DESKTOP_UPDATE_PUBLISH_URL }}
      DESKTOP_UPDATE_PUBLISH_TOKEN: ${{ secrets.DESKTOP_UPDATE_PUBLISH_TOKEN }}
