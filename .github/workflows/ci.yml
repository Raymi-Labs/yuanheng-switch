name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.12.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Check experimental Agent build contract
        run: |
          node --test scripts/test-agent-experimental-features.mjs
          VITE_ENABLE_ACCIO_WORK=1 pnpm exec vitest run tests/hooks/useModelSwitchCenter.test.tsx tests/components/AccioConnectionNotice.test.tsx tests/components/ToolActivationProgress.test.tsx tests/components/ToolSetupGrid.groups.test.tsx tests/hooks/useDesktopInstallFlow.test.tsx tests/lib/accioExperimental.test.ts tests/lib/traeSetup.test.ts tests/components/TraeSetupGuide.test.tsx tests/components/TraeInstallationActions.test.tsx

      - name: Test bundled image skill
        run: node --test scripts/test-imagegen-skill.mjs

      - name: Test desktop mirror resume
        run: |
          python3 scripts/test_mirror_desktop_update.py
          python3 scripts/test_sync_desktop_r2.py

      - name: Test macOS release verification
        run: |
          python3 scripts/test_apple_release_tools.py
          python3 scripts/test_verify_macos_release.py

  backend:
    name: Backend Checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Cache Cargo registry and build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-v2-

      - name: Create Tauri build placeholders
        shell: bash
        run: |
          mkdir -p dist src-tauri/binaries
          HOST_TARGET="$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')"
          test -n "$HOST_TARGET"
          if [[ "$HOST_TARGET" == *windows* ]]; then
            SIDECAR_SUFFIX=".exe"
          else
            SIDECAR_SUFFIX=""
          fi
          : > "src-tauri/binaries/yuanheng-core-${HOST_TARGET}${SIDECAR_SUFFIX}"

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check Apple Silicon experimental Accio
        if: runner.os == 'macOS'
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --features accio-work-experimental -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --features accio-work-experimental --lib accio -- --test-threads=1
